name: Publish AXIOM packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Test and build
        run: npm run check

      # ---------------------------------------------------------
      # Publish to npm Registry
      # Bootstrap authentication using NPM_TOKEN.
      # Already published versions are skipped.
      # ---------------------------------------------------------

      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_if_missing() {
            PACKAGE="$1"
            WORKSPACE="$2"

            if npm view "$PACKAGE@0.1.1" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Skipping $PACKAGE@0.1.1 — already published on npm"
            else
              echo "Publishing $PACKAGE@0.1.1 to npm..."
              npm publish \
                --workspace "$WORKSPACE" \
                --registry=https://registry.npmjs.org \
                --access public
            fi
          }

          publish_if_missing "@glydexstudio/axiom-memory" "packages/memory"
          publish_if_missing "@glydexstudio/axiom-tools" "packages/tools"
          publish_if_missing "@glydexstudio/axiom-knowledge" "packages/knowledge"
          publish_if_missing "@glydexstudio/axiom-vision" "packages/vision"
          publish_if_missing "@glydexstudio/axiom-voice" "packages/voice"
          publish_if_missing "@glydexstudio/axiom-core" "packages/core"
          publish_if_missing "@glydexstudio/axiom-providers" "packages/providers"
          publish_if_missing "@glydexstudio/axiom-agents" "packages/agents"

      # ---------------------------------------------------------
      # Publish to GitHub Packages
      # Uses GH_PACKAGES_TOKEN.
      # Already published versions are skipped.
      # ---------------------------------------------------------

      - name: Setup GitHub Packages authentication
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@glydexstudio"

      - name: Publish packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          publish_if_missing() {
            PACKAGE="$1"
            WORKSPACE="$2"

            if npm view "$PACKAGE@0.1.1" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "Skipping $PACKAGE@0.1.1 — already published on GitHub Packages"
            else
              echo "Publishing $PACKAGE@0.1.1 to GitHub Packages..."
              npm publish \
                --workspace "$WORKSPACE" \
                --registry=https://npm.pkg.github.com
            fi
          }

          publish_if_missing "@glydexstudio/axiom-memory" "packages/memory"
          publish_if_missing "@glydexstudio/axiom-tools" "packages/tools"
          publish_if_missing "@glydexstudio/axiom-knowledge" "packages/knowledge"
          publish_if_missing "@glydexstudio/axiom-vision" "packages/vision"
          publish_if_missing "@glydexstudio/axiom-voice" "packages/voice"
          publish_if_missing "@glydexstudio/axiom-core" "packages/core"
          publish_if_missing "@glydexstudio/axiom-providers" "packages/providers"
          publish_if_missing "@glydexstudio/axiom-agents" "packages/agents"
